<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bittnah and Ellie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #201e1d;
    overflow: hidden;
    font-family: "Caprasimo", Georgia, "Times New Roman", serif;
  }

  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* The photo is portrait, most screens are not. A blurred, dimmed copy
     fills whatever the contained photo leaves over, so the page has no
     hard letterbox bars at any aspect ratio. Oversized and clipped so the
     blur has no soft edge against the viewport. */
  .bg {
    position: absolute; inset: -6%;
    width: 112%; height: 112%;
    object-fit: cover;
    filter: blur(38px) brightness(0.5) saturate(0.85);
  }

  /* Viewport units, not percentages: as a centred flex/grid item the photo's
     containing block is sized by the photo, so a percentage max-height has
     nothing definite to resolve against and the image renders at its full
     1350x1800 (overflow:hidden then reads as a crop). vh/dvh always resolve. */
  .photo {
    position: relative;
    width: auto; height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    object-fit: contain;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
  }

  /* Legibility floor for the caption, independent of what is behind it. */
  .scrim {
    position: absolute; inset: auto 0 0 0; height: 42%;
    background: linear-gradient(180deg,
      rgba(32, 30, 29, 0) 0%,
      rgba(32, 30, 29, 0.55) 45%,
      rgba(32, 30, 29, 0.9) 100%);
    pointer-events: none;
  }

  h1 {
    position: absolute; left: 0; right: 0;
    bottom: clamp(18px, 5vh, 66px);
    margin: 0; padding: 0 5vw;
    text-align: center;
    color: #f5ead8;
    font-weight: 400;
    font-size: clamp(1.5rem, 6.4vw, 5.25rem);
    line-height: 1.04;
    letter-spacing: 0.015em;
    text-shadow: 0 2px 28px rgba(0, 0, 0, 0.65);
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="photos/bittnah-and-ellie.jpg" alt="" aria-hidden="true">
    <img class="photo" src="photos/bittnah-and-ellie.jpg"
         alt="Bittnah on a couch holding Ellie, a black-and-tan dog, who is licking her face.">
    <div class="scrim"></div>
    <h1>BITTNAH AND ELLIE</h1>
  </div>
</body>
</html>
